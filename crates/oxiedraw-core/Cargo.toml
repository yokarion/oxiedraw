[package]
name = "oxiedraw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Tests needing a real device. Off by default: CI runs on lavapipe, which has
# no VK_EXT_image_drm_format_modifier.
gpu-tests = []

[dependencies]
oxiedraw-utils.workspace = true

ash.workspace = true
gpu-allocator.workspace = true

cosmic-text.workspace = true

thiserror.workspace = true
tracing.workspace = true

serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
png = { workspace = true }
jpeg-encoder = { workspace = true }
image = { workspace = true }
ravif = { workspace = true }
rgb = { workspace = true }

[[test]]
name = "adjustment_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "blend_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "brushes_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "filters_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "liquify_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "present_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "resize_perf"
required-features = ["gpu-tests"]

[[test]]
name = "selection_delete_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "selection_ops_gpu"
required-features = ["gpu-tests"]

[[test]]
name = "smudge_gpu"
required-features = ["gpu-tests"]
