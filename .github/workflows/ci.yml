name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-

      # Only the non-ignored tests run here. The `#[ignore]` GPU tests need
      # VK_EXT_image_drm_format_modifier for the dmabuf display path, which
      # lavapipe does not implement, so they stay a local step on real hardware:
      #   cargo nextest run --workspace --run-ignored ignored-only
      - name: Tests
        run: cargo nextest run --workspace --locked

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-

      - name: Resolve version
        id: ver
        run: |
          set -eu
          # The container user differs from the checkout owner, so git refuses to
          # run here until the workspace is marked safe.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          # GITHUB_REF is the one thing every runner sets reliably.
          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              ;;
            *)
              base="$(cargo metadata --no-deps --format-version 1 \
                      | jq -r '.packages[] | select(.name == "oxiedraw") | .version')"
              version="${base}-g$(git rev-parse --short HEAD)"
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          stage="stage/oxiedraw-${version}-x86_64-linux"
          mkdir -p "${stage}" dist
          install -Dm755 target/release/oxiedraw "${stage}/oxiedraw"
          strip "${stage}/oxiedraw"
          install -Dm644 LICENSE "${stage}/LICENSE"
          install -Dm644 README.md "${stage}/README.md"
          install -Dm644 data/com.yokarion.oxiedraw.desktop "${stage}/com.yokarion.oxiedraw.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/com.yokarion.oxiedraw.svg \
            "${stage}/com.yokarion.oxiedraw.svg"
          tar -C stage -caf "dist/oxiedraw-${version}-x86_64-linux.tar.zst" \
            "oxiedraw-${version}-x86_64-linux"

      # Runtime data the AppImage needs but the base image lacks. linuxdeploy
      # only bundles what is installed here: the SVG pixbuf loader (every tool
      # icon is SVG - without it they render as broken frames), the Cantarell UI
      # font (libadwaita's look), and the desktop GSettings schemas (font,
      # text-scaling, dark/light). The dconf backend is already in the image.
      - name: Install AppImage runtime deps
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            librsvg2-common \
            fonts-cantarell \
            gsettings-desktop-schemas

      # linuxdeploy bundles GTK4/libadwaita/glib/pango into the AppDir so the
      # AppImage runs without GTK installed. No FUSE in the job container,
      # hence APPIMAGE_EXTRACT_AND_RUN.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          export PATH="${PWD}:${PATH}"

          # Deploy + run the gtk plugin, but do NOT package yet. Split from the
          # --output step so we can patch the hook the plugin writes.
          VERSION="${version}" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/oxiedraw \
            --desktop-file data/com.yokarion.oxiedraw.desktop \
            --icon-file data/icons/hicolor/scalable/apps/com.yokarion.oxiedraw.svg \
            --plugin gtk

          # Strip two forced env exports the gtk plugin bakes into its AppRun hook:
          #  - GDK_BACKEND=x11: a stale GTK3 workaround that forces the app onto
          #    XWayland, where it ignores the compositor's monitor scale.
          #  - GTK_THEME=Adwaita:<variant>: loads GTK's legacy built-in theme over
          #    libadwaita's stylesheet, freezing the color-scheme and breaking the
          #    system accent / named colors that the custom CSS builds on.
          # Both were compensating for data we now bundle (Wayland libs,
          # gsettings-desktop-schemas), so removing them makes the AppImage behave
          # like the native binary.
          hook="AppDir/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          test -f "${hook}"
          sed -i '/export GDK_BACKEND=x11/d; /export GTK_THEME=/d' "${hook}"
          ! grep -qE 'GDK_BACKEND=x11|export GTK_THEME=' "${hook}"

          # Package the patched AppDir (no --plugin, so the hook is not rewritten).
          VERSION="${version}" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage
          mv OxieDraw-*-x86_64.AppImage "dist/OxieDraw-${version}-x86_64.AppImage"

      - name: Checksums
        run: |
          set -eu
          cd dist
          # Named explicitly so a re-run cannot hash a stale SHA256SUMS.
          sha256sum oxiedraw-*.tar.zst OxieDraw-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
