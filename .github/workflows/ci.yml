name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-lint-

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-test-

      - name: Tests
        run: cargo test --workspace --locked

  build:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/yokarion/rust-toolchain-container:latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
            target
          key: cargo-build-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-build-

      - name: Resolve version
        id: ver
        run: |
          set -eu
          # The container user differs from the checkout owner, so git refuses to
          # run here until the workspace is marked safe.
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          case "${GITHUB_REF}" in
            refs/tags/v*)
              version="${GITHUB_REF#refs/tags/v}"
              ;;
            *)
              base="$(cargo metadata --no-deps --format-version 1 \
                      | jq -r '.packages[] | select(.name == "oxiedraw") | .version')"
              version="${base}-g$(git rev-parse --short HEAD)"
              ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "building version ${version}"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package tarball
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          stage="stage/oxiedraw-${version}-x86_64-linux"
          mkdir -p "${stage}" dist
          install -Dm755 target/release/oxiedraw "${stage}/oxiedraw"
          strip "${stage}/oxiedraw"
          install -Dm644 LICENSE "${stage}/LICENSE"
          install -Dm644 README.md "${stage}/README.md"
          install -Dm644 data/com.yokarion.oxiedraw.desktop "${stage}/com.yokarion.oxiedraw.desktop"
          install -Dm644 data/icons/hicolor/scalable/apps/com.yokarion.oxiedraw.svg \
            "${stage}/com.yokarion.oxiedraw.svg"
          tar -C stage -caf "dist/oxiedraw-${version}-x86_64-linux.tar.zst" \
            "oxiedraw-${version}-x86_64-linux"

      # linuxdeploy only bundles what is installed here. Without these the
      # AppImage ships broken icons, no Cantarell, and no desktop schemas.
      - name: Install AppImage runtime deps
        run: |
          set -eu
          apt-get update -qq
          apt-get install -y --no-install-recommends \
            librsvg2-common \
            fonts-cantarell \
            gsettings-desktop-schemas

      # No FUSE in the job container, hence APPIMAGE_EXTRACT_AND_RUN.
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: "4"
        run: |
          set -eu
          version="${{ steps.ver.outputs.version }}"
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          export PATH="${PWD}:${PATH}"

          # Deploy only; packaging waits until the plugin's hook is patched.
          VERSION="${version}" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable target/release/oxiedraw \
            --desktop-file data/com.yokarion.oxiedraw.desktop \
            --icon-file data/icons/hicolor/scalable/apps/com.yokarion.oxiedraw.svg \
            --plugin gtk

          # The gtk plugin forces GDK_BACKEND=x11 (XWayland, wrong monitor
          # scale) and GTK_THEME=Adwaita (overrides libadwaita's stylesheet and
          # the system accent). Both compensate for data we now bundle.
          hook="AppDir/apprun-hooks/linuxdeploy-plugin-gtk.sh"
          test -f "${hook}"
          sed -i '/export GDK_BACKEND=x11/d; /export GTK_THEME=/d' "${hook}"
          ! grep -qE 'GDK_BACKEND=x11|export GTK_THEME=' "${hook}"

          # No --plugin here, or the hook is rewritten and the patch undone.
          VERSION="${version}" ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --output appimage
          mv OxieDraw-*-x86_64.AppImage "dist/OxieDraw-${version}-x86_64.AppImage"

      - name: Checksums
        run: |
          set -eu
          cd dist
          # Named explicitly so a re-run cannot hash a stale SHA256SUMS.
          sha256sum oxiedraw-*.tar.zst OxieDraw-*.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
